<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cad">
  <title>Vertrieb Glasfaser</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vertrieb">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Startseite: Tagesübersicht -->
  <section id="view-home" class="view">
    <header><h1>Heute</h1></header>
    <div id="stats" class="stats"></div>
    <button id="btn-new" class="big primary">+ Nächste Tür</button>
    <h2>Mein Gebiet</h2>
    <ul id="streets" class="list"></ul>
    <form id="form-street" class="row" autocomplete="off">
      <input name="street" placeholder="Straße hinzufügen" required>
      <button type="submit" class="secondary short">+</button>
    </form>
    <details id="import">
      <summary>Adressliste einlesen</summary>
      <textarea id="import-text" rows="5" placeholder="Straßen oder Adressen einfügen, eine pro Zeile (z. B. aus Excel kopiert)"></textarea>
      <label class="file secondary">Oder Datei wählen (Excel, CSV)<input type="file" id="import-file" accept=".xlsx,.csv,.txt,text/plain,text/csv" hidden></label>
      <button type="button" id="btn-import" class="secondary">Übernehmen</button>
    </details>
    <h2>Heute besucht</h2>
    <ul id="list" class="list"></ul>
    <button id="btn-export" class="secondary">Als CSV exportieren</button>
  </section>

  <!-- Straße: alle Häuser mit Status -->
  <section id="view-street" class="view" hidden>
    <header><button class="back" data-go="home">‹</button><h1 id="street-name"></h1></header>
    <label class="check"><input type="checkbox" id="only-open"> Nur offene zeigen</label>
    <ul id="doors" class="list"></ul>
    <button id="btn-other" class="secondary">+ Andere Hausnummer</button>
  </section>

  <!-- Schritt 1: Adresse und Ergebnis an der Tür -->
  <section id="view-door" class="view" hidden>
    <header><button class="back" data-go="home">‹</button><h1>Tür</h1></header>
    <form id="form-address" class="address" autocomplete="off">
      <input name="street" placeholder="Straße" required>
      <div class="row">
        <input name="number" placeholder="Nr." required inputmode="text" class="short">
        <button type="button" id="btn-plus" class="secondary short" title="Nächste Hausnummer">+2</button>
      </div>
      <div class="row">
        <input name="zip" placeholder="PLZ" inputmode="numeric" class="short">
        <input name="city" placeholder="Ort">
      </div>
      <input name="note" placeholder="Notiz (optional)">
    </form>
    <p id="info" class="done"></p>
    <a id="maps" class="maps" target="_blank" rel="noopener">Route in Karten öffnen</a>
    <p id="done" class="done"></p>
    <div class="outcomes">
      <button data-outcome="nicht_angetroffen">Nicht angetroffen</button>
      <button data-outcome="interesse">Interessiert</button>
      <button data-outcome="abgelehnt">Kein Interesse</button>
      <button data-outcome="vertrag" class="primary">Vertrag</button>
    </div>
    <details class="more">
      <summary>Weitere Status</summary>
      <div class="outcomes">
        <button data-outcome="we_unstimmig">WE unstimmig</button>
        <button data-outcome="unbewohnt">Unbewohnt</button>
        <button data-outcome="gewerbe">Gewerbe</button>
        <button data-outcome="unbemerkbar">Unbemerkbar</button>
        <button data-outcome="blacklist">Blacklist</button>
      </div>
    </details>
  </section>

  <!-- Schritt 2: Auftrag aufnehmen -->
  <section id="view-order" class="view" hidden>
    <header><button class="back" data-go="door">‹</button><h1>Vertrag</h1></header>
    <form id="form-order" autocomplete="off">
      <p class="addr" id="order-addr"></p>
      <label>Glasfaser verfügbar?</label>
      <div class="choice" data-field="available">
        <button type="button" data-value="ja">Ja</button>
        <button type="button" data-value="nein">Nein</button>
        <button type="button" data-value="unklar">Unklar</button>
      </div>
      <label>Tarif</label>
      <div class="choice" data-field="tariff" id="tariffs"></div>
      <input name="name" placeholder="Vor- und Nachname">
      <input name="phone" placeholder="Telefon" type="tel">
      <input name="email" placeholder="E-Mail" type="email">
      <label>Unterschrift</label>
      <canvas id="signature" height="160"></canvas>
      <button type="button" id="btn-clear-sig" class="secondary">Unterschrift löschen</button>
      <p id="order-error" class="error"></p>
      <button type="submit" class="big primary">Vertrag speichern</button>
    </form>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
